name: Build By LainProject (Windows 7 compatible)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'

      - name: Install pinned build tool
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "pyinstaller==5.13.2"

      - name: Build Windows 7 compatible EXE
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --noupx --name ByLainProject ByLainProject_scanner.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ByLainProject-Windows7
          path: dist/ByLainProject.exe
          if-no-files-found: error
